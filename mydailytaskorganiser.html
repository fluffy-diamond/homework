<!DOCTYPE html>
<html>
<head>
  <title>task organizer</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

  <style>
    body {
      background: black;
      color: white;
    }

    h1, h3 {
      color: white;
    }

    .box {
      background: #222;
      color: white;
      border: 1px solid white;
    }

    .card {
      background: #111;
      border: 1px solid white;
    }

    .text-muted {
      color: #aaa !important;
    }

    button {
      margin-top: 5px;
    }
  </style>
</head>

<body>
  <div class="container py-4">

    <h1 class="mb-1">task organizer</h1>
    <p class="text-muted mb-4">use javascript array methods</p>

    <div class="card mb-4">
      <div class="card-body">
        <h3 class="card-title">daily tasks</h3>

        <button class="btn btn-secondary mr-2" onclick="sortAZ()">sort A to Z</button>
        <button class="btn btn-secondary" onclick="sortZA()">sort Z to A</button>

        <div id="taskResult" class="box p-3 mt-3 rounded"></div>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <h3 class="card-title">task time needed</h3>

        <button class="btn btn-secondary mr-2" onclick="sortShortest()">shortest first</button>
        <button class="btn btn-secondary" onclick="sortLongest()">longest first</button>

        <div id="timeResult" class="box p-3 mt-3 rounded"></div>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <h3 class="card-title">label every task time</h3>

        <button class="btn btn-secondary" onclick="addLabel()">add minutes label</button>

        <div id="labelResult" class="box p-3 mt-3 rounded"></div>
      </div>
    </div>

  </div>

  <script>
    var tasks = ["Homework", "Breakfast", "Exercise", "Reading", "Packing Bag"];
    var minutes = [30, 15, 20, 25, 10];

    document.getElementById("taskResult").innerHTML = "tasks: " + tasks;
    document.getElementById("timeResult").innerHTML = "minutes: " + minutes;
    document.getElementById("labelResult").innerHTML = "press button";

    function sortAZ() {
      tasks.sort();
      document.getElementById("taskResult").innerHTML = "A to Z: " + tasks;
    }

    function sortZA() {
      tasks.sort();
      tasks.reverse();
      document.getElementById("taskResult").innerHTML = "Z to A: " + tasks;
    }

    function sortShortest() {
      minutes.sort(function(a, b) {
        return a - b;
      });
      document.getElementById("timeResult").innerHTML = "shortest first: " + minutes;
    }

    function sortLongest() {
      minutes.sort(function(a, b) {
        return b - a;
      });
      document.getElementById("timeResult").innerHTML = "longest first: " + minutes;
    }

    function addLabel() {
      var labelledMinutes = minutes.map(function(time) {
        return time + " mins";
      });
      document.getElementById("labelResult").innerHTML = "labelled: " + labelledMinutes;
    }
  </script>
</body>
</html>
