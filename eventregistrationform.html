<!DOCTYPE html>
<html>
<head>
  <title>Event Registration Form</title>
 
  <style>
    body {color: midnightblue;text-align: center;}
    .form1 {width: 520px; border: 3px solid blue;border-radius: 15px;margin: 40px;padding: 25px;}
    h1 {color: blue;}
    label {text-align: left;font-weight: bold; margin: 12px;}
    select {width: 95%;padding: 10px;margin: 6px;border: 2px solid aqua; border-radius: 10px;}
    button {background-color: blue;color: white;padding: 15px;font-size: 16px;font-weight: bold;margin: 20px;}
    button:hover {background-color: midnightblue;color: beige;}
    #feedback {margin-top: 20px;padding: 15px;border-radius: 12px;font-weight: bold;line-height: 1.6;}
    .success {background-color: #dcfce7;color: #166534;border: 2px solid #22c55e;}
    .error {background-color: #fee2e2;color: #991b1b;border: 2px solid #ef4444;}
  </style>
</head>
<body>
  <div class="form1">
    <h1>Event Registration Form</h1>
    <p>Please fill in the form </p>
    <form id="eventform">
      <label for="name">Student Name</label>
      <input
        type="text"
        id="studentName"
        required
        placeholder="Name"
      >
      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        required
        placeholder="Email"
      >
      <label for="age">Age</label>
      <input
        type="number"
        id="age"
        required
        placeholder="Age"
        min="1"
      >
      <label for="event">Choose Event</label>
      <select id="event" required>
        <option value="">Select an event</option>
        <option value="Math High-flyer">Math High-flyer</option>
        <option value="ICT game booths">ICT game booths</option>
        <option value="Sports Day">Sports Day</option>
        <option value="Swiming Gala">Swiming Gala</option>
      </select>
      <button type="button" onclick="register()">Finished Form</button>
    </form>
    <div id="feedback">
      Registering
    </div>
  </div>
  <script>
    function register() {
      let form = document.getElementById("eventform");
      let feedback = document.getElementById("feedback");
 
      try {
        if (!form.checkValidity()) {
          throw form.reportValidity();
        }
        let name = document.getElementById("name").value;
        let email = document.getElementById("email").value;
        let age = Number(document.getElementById("age").value);
        let event = document.getElementById("event").value;
        if (name ==="") {
          throw "Please input your name";
        }
        if (age ==="") {
          throw "Please input your age";
        }
        if (event === "") {
          throw "Please select an event";
        }
        feedback.classname = "";
        feedback.innerHTML = "Checking details...";
        setTimeout(function() {
          let nummber = Math.floor(Math.random() * 9000) + 1000;
          feedback.classname = "success";
          feedback.innerHTML =
            "Registration Successful!<br>" +
            "Student Name: " + name + "<br>" +
            "Email: " + email + "<br>" +
            "Age: " + age + "<br>" +
            "Event: " + event + "<br>" +
            "Your Event Pass Number: EVT-" + number;
        }, 2000);
      } catch (error) {
        feedback.className = "error";
        if (error !== undefined) {
          feedback.innerHTML = "Registration failed: " + error;
        } else {
          feedback.innerHTML = "Please complete all required fields correctly.";
        }
      }
    }
  </script>
</body>
</html>
