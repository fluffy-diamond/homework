<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Grid</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <style type="text/css">
  h1 {
    color: rgb(45, 0, 128);
  }
  #a1, #a4 {
    color: rgb(255, 255, 255);
    background: rgb(255, 255, 49);
    font-size: 20px;
  }
  #a2, #a5 {
    color: rgb(255, 255, 255);
    background: rgb(34, 128, 0);
    font-size: 20px;
  }
  #a3, #a6 {
    color: rgb(255, 255, 255);
    background: rgb(255, 145, 0);
    font-size: 20px;
  }
</style>
  </head>
  <body>
    <div class="container-fluid">
  <h1>Unequal Area Grids</h1>
  <div class="row">
    <div id="a1" class="col-sm-3">HALO</div>
    <div id="a2" class="col-sm-4">HI</div>
    <div id="a3" class="col-sm-5">HELLO</div>
  </div>

  <div class="row">
    <div id="a4" class="col-sm-2">ELLO</div>
    <div id="a5" class="col-sm-6">HIII</div>
    <div id="a6" class="col-sm-4">HALOOO</div>
  </div>
</div>
  </body>
</html>
